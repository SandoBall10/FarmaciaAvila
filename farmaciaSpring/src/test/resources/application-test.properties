# Tests aislados en H2. No usan PostgreSQL ni secretos de desarrollo.
spring.datasource.url=jdbc:h2:mem:farmacia_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

# Flyway se valida en local/prod contra PostgreSQL. En tests el esquema lo crea Hibernate.
spring.flyway.enabled=false

jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWZhcm1hY2lhLWF2aWxhLTEyMzQ1Njc4OTA=
jwt.expiration-ms=3600000
app.cors.allowed-origins=http://localhost:5173
