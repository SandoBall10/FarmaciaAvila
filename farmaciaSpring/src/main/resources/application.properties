spring.application.name=farmaciaSpring
spring-boot.run.jvmArguments=-XX:+EnableDynamicAgentLoading -Djdk.instrument.traceUsage=true

server.port=8010
spring.datasource.url=jdbc:postgresql://localhost:5432/farmacia_avila
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.config.import=optional:file:./application-local.properties
jwt.secret=${JWT_SECRET}
