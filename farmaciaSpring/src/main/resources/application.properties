spring.application.name=farmaciaSpring
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

server.port=8010
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/farmacia_avila}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Flyway se activa solo en perfiles local y prod.
spring.flyway.enabled=false
